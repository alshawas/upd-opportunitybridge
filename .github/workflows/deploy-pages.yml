name: Validate and Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: opportunitybridge-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: pip install jsonschema requests
      - name: Validate source data
        run: python scripts/validate_data.py
      - name: Rebuild generated browser assets
        run: python scripts/build_assets.py
      - name: Compile C++ matching core to WebAssembly
        run: |
          clang++ --target=wasm32 -O3 -nostdlib \
            -Wl,--no-entry -Wl,--export=match_score -Wl,--export=bit_count -Wl,--export=engine_version \
            -Wl,--strip-all -o matcher.wasm src/matcher.cpp
      - name: Run deterministic matcher checks
        run: python scripts/test_matcher.py
      - name: Cross-check WebAssembly against JavaScript fallback
        run: node scripts/test_wasm.mjs
      - name: Confirm generated files are committed
        run: git diff --exit-code -- data.js verification.js signals.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
