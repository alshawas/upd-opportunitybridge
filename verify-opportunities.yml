name: Verify Opportunity Sources

on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: opportunity-source-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests jsonschema
      - name: Check official sources
        run: python scripts/verify_sources.py
      - name: Validate catalog
        run: python scripts/validate_data.py
      - name: Rebuild browser snapshot
        run: python scripts/build_assets.py
      - name: Commit changed health state
        run: |
          if git diff --quiet -- verification/health.json verification.js; then
            echo "No source-health changes."
          else
            git config user.name "opportunitybridge-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add verification/health.json verification.js
            git commit -m "chore: refresh opportunity source health"
            git push
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload refreshed site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy refreshed source status
        id: deployment
        uses: actions/deploy-pages@v4
